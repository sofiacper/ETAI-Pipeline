# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # kept in the data but never used as model features: the row id and COMPAS's own score
  # (the redundant columns are removed earlier, by clean_dataset() -- see diagnostics.redundant_columns)
  drop_columns: ["id", "decile_score", "score_text"]

# Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to fit,
# tune, compare or choose anything. Used only for the final assessment.
# Do not change these two values after week 4 -- a new seed would silently give you a
# different (already partly "seen") test set.
test_set:
  size: 0.2
  random_state: 42

# Week 4: how models are evaluated -- stratified k-fold cross-validation on the
# development set (everything except the locked test set). Same random_state = same folds on
# every run, for every model, so comparisons are like-for-like.
cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  # Reported for every run. fbeta_<beta> weights recall beta times as much as precision.
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "f1"        # one of metrics: what tuning maximises and runs are ranked by
  n_jobs: 1             # folds fitted in parallel; -1 = all cores (only pays off for slow models, e.g. random forest)

# The week 3 diagnosis, written down as cleaning rules (found in Practical/W3/notebooks/01_eda_introduction.ipynb).
# clean_dataset() in src/preprocessing.py reads everything below, so it never hardcodes COMPAS's column names.
diagnostics:
  id_column: "id"
  # columns that load as text purely because a placeholder token (see placeholder_tokens below)
  # shows up somewhere in them
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" (week 4): the category cleanup converts columns to text, which turns a real NaN into the string
  # "nan"; its last step turns every token listed here into NaN, so listing "nan" turns those back into gaps.
  # Safe: read_csv already reads a literal "nan" in the file as missing, so any "nan" string was created by the cleanup.
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    juv_misd_count: {min: 0}
    juv_other_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  # multicollinearity casualties (see the EDA notebook's correlation heatmap + VIF section) --
  # dropped by clean_dataset(), so they never reach the features
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# The preprocessing recipe (week 4 -- see Practical/W4/notebooks/02_preprocessing.ipynb). Every step here is
# FITTED on training rows only, inside the model's Pipeline. Encoder and scaler are chosen by hand for now
# (reasons below).
preprocessing:
  # options: "onehot" | "ordinal" | "count" | "target"
  encoder: "target"      # compact (1 column per feature) and informative; sklearn's version cross-fits, so no leak
  # options: "none" | "standard" | "minmax" | "robust"
  scaler: "robust"       # median/IQR: the few extreme counts (e.g. priors_count) don't set the scale for everyone
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  # MNAR-diagnosed columns (see diagnostics above / the EDA notebook's mechanism test) get an
  # extra "_was_missing" flag alongside their imputed value, so the model can still see the
  # pattern even though the fill itself is just a median/mode
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  # Week 6 challenge: engineered features -- fixed formulas (nothing learned from the data, so
  # safe before the split and on new data). Each {name: expression} is evaluated with pandas
  # df.eval(): simple arithmetic/comparison only (no method calls like .clip()). List every new
  # column in numeric_features (or categorical_features) above.
  engineered_features: {}
  #   priors_per_adult_year: "priors_count / (age - 17)"   # rate: priors per adult year (age >= 18)
  # seed for the target encoder's internal cross-fitting (week 4: sklearn's TargetEncoder)
  random_state: 42
  imputation:
    numeric_strategy: "median"        # one of: median | mean | knn | iterative | random_forest
    categorical_strategy: "most_frequent"
    # Extra knobs for the model-based imputers (ignored by median/mean):
    #   n_neighbors: 5      # knn
    #   max_iter: 10        # iterative / random_forest
    #   n_estimators: 50    # random_forest (missForest)

# Week 8: feature selection -- a learned step between preprocessing and the model. Keeps the
# features that at least `min_votes` of three models (random forest, gradient boosting, L1
# logistic regression) choose. Like every learned step it is fitted on the training rows of
# each fold only (inside the Pipeline), and `select__min_votes` is tuned with the model.
feature_selection:
  enabled: true
  min_votes: 2                                      # 1 (keep almost all) .. 3 (keep only unanimous)
  random_state: 42
  search_space:                                     # tuned together with the model when tuning is on
    select__min_votes: {type: int, low: 1, high: 3}

model:
  # one of: "dummy" | "logistic_regression" | "naive_bayes" | "decision_tree" | "random_forest" | "oblique_random_forest" | "adaboost" | "gradient_boosting" | "hist_gradient_boosting" | "xgboost"
  type: "xgboost"             # week 8: XGBoost runs by default (gradient boosting with per-split brakes)
  params:
    random_state: 42
    n_jobs: -1
  # Other models' params, to swap in. class_weight "balanced" weights each class by 1 / its frequency
  # (GradientBoostingClassifier and GaussianNB have no class_weight).
  # logistic_regression:    {max_iter: 2000, class_weight: balanced}
  # naive_bayes:            {}
  # decision_tree:          {random_state: 42, class_weight: balanced}
  # random_forest:          {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest:  {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost:               {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}
  # xgboost:                {random_state: 42, n_jobs: -1}

# Week 5: hyperparameter tuning. Each candidate is scored by cross-validation of the WHOLE
# pipeline (preprocessing + model) on the development set only -- the locked test set is never
# touched. Set `enabled: false` to make main.py behave exactly as it did in week 4.
tuning:
  enabled: true
  n_trials: 30
  n_splits: 5                     # folds that score each candidate
  random_state: 42                # seeds the TPE sampler and those folds
  # Keys are Pipeline parameter names (step__param). Types: int / float (low, high, log) or
  # categorical (choices).
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}   # <= number of features
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000001, high: 0.1, log: true}
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results"   # each run's full report is saved here as run_<config>_<date>.txt
  scoreboard: "results/runs.csv"   # one row per run, appended; compare only runs on the same data, cleaning and folds

# Week 10 (deployment): after training, predict the unseen COMPAS people with predict.py.
prediction:
  model_path: "models/model.joblib"           # the final fitted pipeline, saved by main.py
  new_data_path: "data/compas_new_people.csv"
  output_path: "results/compas_new_predictions.csv"